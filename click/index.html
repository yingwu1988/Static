<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4f7cff">
<title>平板单机版打卡系统</title>
<style>
:root{
  --primary:#4f7cff;--primary-dark:#315fd8;--success:#22a06b;--warning:#e6a23c;
  --danger:#e5484d;--text:#1f2937;--muted:#6b7280;--bg:#f4f7fb;--card:#fff;
  --border:#e5e7eb;--shadow:0 8px 24px rgba(31,41,55,.08);--radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
body{font-size:16px}
button,input,textarea,select{font:inherit}
button{min-height:48px;border:0;border-radius:12px;padding:0 18px;cursor:pointer;touch-action:manipulation}
input,textarea,select{width:100%;min-height:48px;border:1px solid #d7dce5;border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,124,255,.12)}
textarea{min-height:220px;resize:vertical}
.hidden{display:none!important}
.app{min-height:100vh}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#edf3ff,#f7f9fc)}
.login-card{width:min(520px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:var(--shadow)}
.logo{width:72px;height:72px;border-radius:20px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 18px}
h1,h2,h3{margin:0 0 12px} h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
.muted{color:var(--muted)} .small{font-size:13px}.center{text-align:center}
.form-group{margin:16px 0}.form-group label{display:block;font-weight:600;margin-bottom:8px}
.primary{background:var(--primary);color:#fff}.primary:active{background:var(--primary-dark)}
.secondary{background:#eef2f7;color:#374151}.success{background:var(--success);color:#fff}.danger{background:var(--danger);color:#fff}
.warning{background:#fff3dc;color:#8a5b00}.ghost{background:transparent;color:var(--primary);border:1px solid #cbd7ff}
button:disabled{opacity:.5;cursor:not-allowed}
.login-hint{margin-top:16px;padding:12px;border-radius:10px;background:#f5f7fb;color:#5b6472;font-size:13px}
.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left{display:flex;align-items:center;gap:12px;min-width:0}.header-title{font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.container{width:min(1200px,100%);margin:0 auto;padding:20px}
.nav{display:flex;gap:8px;overflow:auto;padding-bottom:8px;margin-bottom:14px}
.nav button{white-space:nowrap;background:#fff;border:1px solid var(--border);color:#4b5563}
.nav button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.stat{display:flex;align-items:center;justify-content:space-between;gap:12px}.stat-number{font-size:30px;font-weight:800}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.table-wrap{overflow:auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:14px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{background:#f8fafc;font-weight:700;position:sticky;top:0}
.badge{display:inline-flex;align-items:center;min-height:30px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
.badge-success{background:#e5f7ef;color:#087443}.badge-warning{background:#fff3dc;color:#8a5b00}
.badge-danger{background:#fde8e8;color:#b4232a}.badge-gray{background:#eef1f5;color:#667085}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.task-card{border:1px solid var(--border);border-radius:14px;padding:18px;background:#fff}
.task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.task-name{font-size:19px;font-weight:700}.task-desc{color:var(--muted);margin-top:6px;line-height:1.6}
.task-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.checkin-btn{min-width:150px;font-weight:700}
.locked{background:#eef1f5;color:#8a919e}
.done{background:#e5f7ef;color:#087443}
.notice{padding:14px 16px;border-radius:12px;background:#eef4ff;color:#31539e;margin-bottom:16px;line-height:1.6}
.warning-box{padding:14px 16px;border-radius:12px;background:#fff7e8;color:#8a5b00;margin-bottom:16px;line-height:1.6}
.danger-box{padding:14px 16px;border-radius:12px;background:#fff0f0;color:#a7272e;margin-bottom:16px;line-height:1.6}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.52);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.22)}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-body{padding:20px}.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.icon-btn{width:48px;padding:0;background:#eef2f7;color:#374151}
.form-error{color:var(--danger);font-size:13px;margin-top:6px;min-height:18px}
.checkbox-row{display:flex;align-items:center;gap:10px;min-height:48px}.checkbox-row input{width:22px;height:22px;min-height:22px}
.achievement-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:16px}
.achievement-card{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);text-align:center;min-width:0}
.achievement-img-wrap{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,#e0f2fe,#bae6fd,#7dd3fc,#38bdf8);overflow:hidden;box-sizing:border-box;border:3px solid transparent;transition:border-color .4s ease,box-shadow .4s ease}
.achievement-img{width:256px;height:256px;max-width:100%;object-fit:contain;filter:grayscale(1);opacity:.55;transition:filter .6s ease,opacity .6s ease,transform .6s ease}
.achievement-card.unlocked .achievement-img-wrap{border-color:#ffd700;box-shadow:0 0 16px rgba(255,215,0,.6),inset 0 0 12px rgba(255,215,0,.25)}
.achievement-card.unlocked .achievement-img{filter:none;opacity:1}
.achievement-card.newly .achievement-img{animation:unlock .6s ease}
@keyframes unlock{0%{filter:grayscale(1);opacity:.35;transform:scale(.9)}60%{filter:none;opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
.achievement-name{font-weight:700;margin-top:10px}.achievement-date{font-size:13px;color:var(--muted);margin-top:5px}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:18px}
.progress{height:10px;background:#e9edf3;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--primary);border-radius:999px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi .card{padding:16px}
.search-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;margin-bottom:16px}
.footer-note{text-align:center;color:#8992a1;font-size:12px;padding:24px 0}
pre.json-preview{white-space:pre-wrap;word-break:break-all;background:#111827;color:#e5e7eb;padding:14px;border-radius:12px;max-height:260px;overflow:auto;font-size:12px}
.toast-container{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(90vw,520px);pointer-events:none}
.toast{padding:13px 16px;border-radius:12px;background:#1f2937;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.2);text-align:center;animation:toastIn .2s ease}
.toast.success{background:#137a50}.toast.error{background:#b4232a}.toast.warning{background:#8a5b00}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.login-input-wrap{position:relative}.password-toggle{position:absolute;right:6px;top:4px;height:40px;min-height:40px;padding:0 12px;background:transparent;color:#6b7280}
@media(max-width:800px){
  .container{padding:14px}.grid-2,.grid-3{grid-template-columns:1fr}
  .kpi{grid-template-columns:repeat(2,1fr)}.search-row{grid-template-columns:1fr 1fr}
  .achievement-grid{gap:10px}.achievement-card{padding:9px}.achievement-name{font-size:14px}
}
@media(max-width:520px){
  .login-card{padding:22px}.header{align-items:flex-start}.header-actions button{padding:0 12px}
  .search-row{grid-template-columns:1fr}.achievement-grid{gap:8px}
  .achievement-card{border-radius:12px}.achievement-img{width:128px;height:128px}
  .modal{border-radius:16px}.modal-mask{padding:8px}
}
.pet-bubble{position:relative;background:#fff;border:1px solid #dde0e6;border-radius:12px;padding:10px 14px;margin-bottom:12px;text-align:center;font-size:15px;color:#444}
.pet-bubble::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-8px;border-width:8px 8px 0;border-style:solid;border-color:#fff transparent transparent}
.pet-bubble::before{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-10px;border-width:9px 9px 0;border-style:solid;border-color:#dde0e6 transparent transparent}
.pet-page{max-width:560px;margin:0 auto}
.pet-img-wrap{width:200px;height:200px;margin:0 auto 12px;border-radius:50%;overflow:hidden;border:3px solid #e0f2fe;background:linear-gradient(135deg,#e0f2fe,#bae6fd,#7dd3fc,#38bdf8);display:flex;align-items:center;justify-content:center}
.pet-img-wrap.dead{filter:grayscale(1);opacity:.6}
.pet-img-wrap.sick{border-color:#fbbf24}
.pet-img-wrap img{width:100%;height:100%;object-fit:cover}
.pet-name{font-size:20px;font-weight:700;text-align:center;cursor:pointer}
.pet-name:hover{text-decoration:underline}
.pet-status{text-align:center;margin:6px 0}
.pet-bar{margin:8px 0}
.pet-bar-label{display:flex;justify-content:space-between;font-size:13px;color:#667085;margin-bottom:2px}
.pet-bar-track{height:10px;background:#e9edf3;border-radius:5px;overflow:hidden}
.pet-bar-fill{height:100%;border-radius:5px;transition:width .3s}
.pet-bar-fill.full{background:linear-gradient(90deg,#34d399,#10b981)}
.pet-bar-fill.clean{background:linear-gradient(90deg,#60a5fa,#3b82f6)}
.pet-bar-fill.intimacy{background:linear-gradient(90deg,#f472b6,#ec4899)}
.pet-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.pet-adopt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pet-adopt-card{text-align:center;padding:12px;border-radius:12px;border:1px solid var(--border);background:#fff}
.pet-adopt-card img{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 8px}
.pet-adopt-card.dead img{filter:grayscale(1);opacity:.6}
.pet-shop-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.pet-shop-item-info{flex:1}
.pet-shop-item-price{font-weight:700;color:#b45309}
.pet-config-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pet-config-grid .form-group{margin-bottom:0}
@media(max-width:520px){.pet-adopt-grid{grid-template-columns:repeat(2,1fr)}.pet-config-grid{grid-template-columns:1fr}.pet-img-wrap{width:160px;height:160px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toastContainer" class="toast-container"></div>

<script>
"use strict";

/* =========================================================
   平板单机版打卡系统
   单文件 HTML / CSS / JavaScript
   数据仅保存于浏览器 LocalStorage。

const STORAGE_KEY = "tablet_checkin_system_v1";
const SESSION_KEY = "tablet_checkin_session_v1";
const APP_VERSION = 1;
const OPEN_HOUR = 5;

const ACHIEVEMENTS = [

  ["ox","牛","https://yingwu1988.github.io/Static/click/img/2.png"],

  ["rabbit","兔","https://yingwu1988.github.io/Static/click/img/4.png"],

  ["opera_house","悉尼歌剧院","https://yingwu1988.github.io/Static/click/img/22.png"],

  ["ach24","24","https://yingwu1988.github.io/Static/click/img/24.png"],
  ["ach25","25","https://yingwu1988.github.io/Static/click/img/25.png"],
  ["ach26","26","https://yingwu1988.github.io/Static/click/img/26.png"],
  ["ach27","27","https://yingwu1988.github.io/Static/click/img/27.png"],
  ["ach28","28","https://yingwu1988.github.io/Static/click/img/28.png"],
  ["ach29","29","https://yingwu1988.github.io/Static/click/img/29.png"],
  ["ach30","30","https://yingwu1988.github.io/Static/click/img/30.png"],
  ["ach31","31","https://yingwu1988.github.io/Static/click/img/31.png"]
].map(([id,name,image])=>({id,name,image}));

const PET_ZODIAC = [
  {id:"rat",name:"子鼠",img:"https://yingwu1988.github.io/Static/click/img/pet/1.png"},
  {id:"ox",name:"丑牛",img:"https://yingwu1988.github.io/Static/click/img/pet/2.png"},
  {id:"tiger",name:"寅虎",img:"https://yingwu1988.github.io/Static/click/img/pet/3.png"},
  {id:"rabbit",name:"卯兔",img:"https://yingwu1988.github.io/Static/click/img/pet/4.png"},
  {id:"dragon",name:"辰龙",img:"https://yingwu1988.github.io/Static/click/img/pet/5.png"},
  {id:"snake",name:"巳蛇",img:"https://yingwu1988.github.io/Static/click/img/pet/6.png"},
  {id:"horse",name:"午马",img:"https://yingwu1988.github.io/Static/click/img/pet/7.png"},
  {id:"goat",name:"未羊",img:"https://yingwu1988.github.io/Static/click/img/pet/8.png"},
  {id:"monkey",name:"申猴",img:"https://yingwu1988.github.io/Static/click/img/pet/9.png"},
  {id:"rooster",name:"酉鸡",img:"https://yingwu1988.github.io/Static/click/img/pet/10.png"},
  {id:"dog",name:"戌狗",img:"https://yingwu1988.github.io/Static/click/img/pet/11.png"},
  {id:"pig",name:"亥猪",img:"https://yingwu1988.github.io/Static/click/img/pet/12.png"}
];
const PET_IMG_BASE="https://yingwu1988.github.io/Static/click/img/pet/";
function petImg(id){const z=PET_ZODIAC.find(x=>x.id===id);return z?z.img:PET_IMG_BASE+"1.png"}
function petName(id){const z=PET_ZODIAC.find(x=>x.id===id);return z?z.name:id}

const PET_DIALOG={
  healthy_high:["今天能陪着你真开心","和你在一起感觉特别幸福！","希望我们可以一直相伴~","谢谢你一直细心照顾我！","看到你我就很高兴啦。"],
  healthy_mid:["今天过得平平淡淡。","一切都还算不错哦。","日子安安稳稳就挺好。","有空可以多来看看我。","希望今天一切顺利。"],
  healthy_low:["感觉有点孤单......","你是不是很少来看我？","我不太熟悉你的样子。","要是能多陪陪我就好了。","我提不起什么兴致。"],
  sick_pool:["呜呜，身体好难受","我浑身没有力气，好不舒服。","好想快点好起来。","请快用药剂帮帮我吧。","浑身酸痛，很难受。"],
  dead_pool:["我已经离开了，还记得我们过去的时光吗。","感谢曾经陪伴的日子。","缘分到此，期待新的相遇。"]
};
function getPetRandomDialog(pet){
  if(!pet||!pet.healthStatus)return"......";
  let pool;
  if(pet.healthStatus==="dead")pool=PET_DIALOG.dead_pool;
  else if(pet.healthStatus==="sick")pool=PET_DIALOG.sick_pool;
  else{
    if(pet.intimacy>=70)pool=PET_DIALOG.healthy_high;
    else if(pet.intimacy>=30)pool=PET_DIALOG.healthy_mid;
    else pool=PET_DIALOG.healthy_low;
  }
  if(!Array.isArray(pool)||!pool.length)return"......";
  return pool[Math.floor(Math.random()*pool.length)];
}

function defaultPetConfig(){
  return {
    decayFull:0.028,decayClean:0.028,deltaMaxMin:43200,timeSliceMin:60,
    warnThreshold:30,sickThreshold:20,
    intimacyAddHealthy:0.01,intimacySubSick:0.03,sickToDeathHours:48,
    itemFoodAdd:35,itemCleanerAdd:35,
    priceMedicine:10,priceFood:3,priceCleaner:2,
    autoCareEnable:true,autoCareFullMin:45,autoCareCleanMin:45
  };
}
function defaultBackpack(){return[{itemId:"medicine",name:"药剂",count:0},{itemId:"food",name:"宠物粮",count:0},{itemId:"cleaner",name:"清洁剂",count:0}]}
function defaultPet(){return{petId:"",petName:"",birthTimestamp:0,lastUpdate:0,healthStatus:"healthy",full:80,clean:80,intimacy:30,intimacyZeroTs:0}}
function addPointLog(type,amount,desc){
  const u=state.session.username;
  const s=getStudentPet(u);
  if(!s)return;
  if(!Array.isArray(s.pointLogs))s.pointLogs=[];
  s.pointLogs.unshift({id:"pl_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),type,amount,desc,timestamp:Date.now()});
  if(s.pointLogs.length>200)s.pointLogs.length=200;
}
function addItemLog(username,itemId,itemName,amount,desc){
  const s=getStudentPet(username);
  if(!s)return;
  if(!Array.isArray(s.itemLogs))s.itemLogs=[];
  s.itemLogs.unshift({id:"il_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),itemId,itemName,amount,desc,timestamp:Date.now()});
  if(s.itemLogs.length>300)s.itemLogs.length=300;
}

let autoConsumeFoodCount=0;
let autoConsumeCleanerCount=0;
let petDialogCache="";

const state = {
  data: null,
  session: null,
  page: "home",
  achievementPage: 0,
  modal: null,
  interval: null,
  lastDate: "",
  recordFilters: {date:"",student:"",status:""}
};

function uid(prefix="id"){
  return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
}
function pad(n){return String(n).padStart(2,"0")}
function dateKey(d=new Date()){
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function timeKey(d=new Date()){
  return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
function formatDateTime(value){
  if(!value)return "-";
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return value;
  return dateKey(d)+" "+timeKey(d);
}
function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function deepClone(obj){return JSON.parse(JSON.stringify(obj))}
function defaultData(){

function loadData(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw){
      const d=defaultData();
      localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
      return d;
    }
    const d=JSON.parse(raw);
    return normalizeData(d);
  }catch(e){
    console.error(e);
    const d=defaultData();
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}catch(_){}
    return d;
  }
}
function normalizeData(d){
  if(!d || typeof d!=="object") return defaultData();
  const base=defaultData();
  d.version=Number(d.version)||APP_VERSION;
  d.settings={...base.settings,...(d.settings||{})};
  d.settings.petConfig={...defaultPetConfig(),...(d.settings.petConfig||{})};
  d.accounts=(d.accounts&&typeof d.accounts==="object")?d.accounts:base.accounts;
  for(const u of Object.values(d.accounts)){
    if(u.role==="student"){
      u.achievementPoint=Number(u.achievementPoint)||0;
      u.totalCheckinComplete=Number(u.totalCheckinComplete)||0;
      u.adoptedPetIds=Array.isArray(u.adoptedPetIds)?u.adoptedPetIds:[];
      u.deadPetIds=Array.isArray(u.deadPetIds)?u.deadPetIds:[];
      u.pointLogs=Array.isArray(u.pointLogs)?u.pointLogs:[];
      u.itemLogs=Array.isArray(u.itemLogs)?u.itemLogs:[];
      u.backpack=Array.isArray(u.backpack)&&u.backpack.length===3?u.backpack:defaultBackpack();
      u.pet=u.pet&&typeof u.pet==="object"?{...defaultPet(),...u.pet}:defaultPet();
    }
  }
  d.taskTemplates=Array.isArray(d.taskTemplates)?d.taskTemplates:[];
  d.dailyTasks=(d.dailyTasks&&typeof d.dailyTasks==="object")?d.dailyTasks:{};
  d.attendance=(d.attendance&&typeof d.attendance==="object")?d.attendance:{};
  d.achievements=(d.achievements&&typeof d.achievements==="object")?d.achievements:{};
  return d;
}

let _audioCtx=null;
function playDing(){
  try{
    if(!_audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      _audioCtx=new AC();
    }
    if(_audioCtx.state==="suspended")_audioCtx.resume();
    const t=_audioCtx.currentTime;
    const osc=_audioCtx.createOscillator();
    const gain=_audioCtx.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(880,t);
    osc.frequency.exponentialRampToValueAtTime(1760,t+0.12);
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(0.35,t+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    osc.connect(gain).connect(_audioCtx.destination);
    osc.start(t);
    osc.stop(t+0.55);
  }catch(e){}
}

function timeToMinutes(t){
  if(!/^\d{2}:\d{2}$/.test(t))return -1;
  const [h,m]=t.split(":").map(Number);
  if(h>23||m>59)return -1;
  return h*60+m;
}
function currentMinutes(){const d=new Date();return d.getHours()*60+d.getMinutes()}

function ensureDailyTasks(forceDate=null){
  const now=new Date();
  const today=forceDate||dateKey(now);
  if(now.getHours()<OPEN_HOUR && !forceDate) return false;
  const enabled=state.data.taskTemplates.filter(t=>t.enabled);
  if(!state.data.dailyTasks[today]){
    state.data.dailyTasks[today]=enabled.map(t=>({
      instanceId:uid("daily"),
      templateId:t.id,
      name:t.name,
      description:t.description,
      deadline:t.deadline,
      generatedAt:now.toISOString()
    }));
    saveData();
    return true;
  }
  const existing=new Set(state.data.dailyTasks[today].map(t=>t.templateId));
  let changed=false;
  for(const t of enabled){
    const daily=state.data.dailyTasks[today].find(x=>x.templateId===t.id);
    if(!daily){
      state.data.dailyTasks[today].push({
        instanceId:uid("daily"),
        templateId:t.id,
        name:t.name,
        description:t.description,
        deadline:t.deadline,
        generatedAt:now.toISOString()
      });
      changed=true;
    }else{
      if(daily.name!==t.name){daily.name=t.name;changed=true}
      if(daily.description!==t.description){daily.description=t.description;changed=true}
      if(daily.deadline!==t.deadline){daily.deadline=t.deadline;changed=true}
    }
  }
  if(changed)saveData();
  return changed;
}
function unlockAchievements(){
  if(!requireAdmin())return;
  const dateFilter=state.recordFilters.date;
  const studentFilter=state.recordFilters.student;
  const before={};
  for(const account of Object.values(state.data.accounts)){
    if(account.role!=="student")continue;
    if(studentFilter && account.username!==studentFilter)continue;
    before[account.username]=(state.data.achievements[account.username]||[]).length;
  }
  syncAchievements({date:dateFilter,student:studentFilter});
  let total=0;
  for(const username of Object.keys(before)){
    const after=(state.data.achievements[username]||[]).length;
    total+=(after-before[username]);
  }
  const scope=[];
  if(dateFilter)scope.push("日期："+dateFilter);
  if(studentFilter)scope.push("学生："+studentFilter);
  if(total>0){
    toast(`成就解锁成功，共发放 ${total} 个（${scope.join(" / ")||"全部"}）`,"success");
  }else{
    toast("暂无可解锁的成就（"+(scope.join(" / ")||"全部")+"）","warning");
  }
  render();
}
function ensureDailyTaskData(){

function getAttendance(username,date){

}
function setAttendance(username,date,instanceId,value){
  if(!state.data.attendance[username])state.data.attendance[username]={};
  if(!state.data.attendance[username][date])state.data.attendance[username][date]={};
  state.data.attendance[username][date][instanceId]=value;
}
function isTaskCompleted(username,date,instanceId){
  return !!getAttendance(username,date)[instanceId]?.completed;
}
function deadlinePassed(task,now=new Date()){
  const m=timeToMinutes(task.deadline);
  if(m<0)return false;
  return now.getHours()*60+now.getMinutes()>m ||
    (now.getHours()*60+now.getMinutes()===m && now.getSeconds()>0);
}
function taskCanCheckin(task){
  if(!todayAfterOpen())return {ok:false,reason:"not-open"};
  if(deadlinePassed(task))return {ok:false,reason:"expired"};
  return {ok:true};
}
function allTasksCompleted(username,date){
  const tasks=state.data.dailyTasks[date]||[];
  if(tasks.length===0)return false;
  return tasks.every(t=>{
    const a=getAttendance(username,date)[t.instanceId];
    if(!a?.completed)return false;
    // 没有打卡时间但标记为已完成，视为按时完成（兼容旧数据/异常数据）
    if(!a.checkinTime)return true;
    const dt=new Date(a.checkinTime);
    if(Number.isNaN(dt.getTime()))return true;
    // 与 deadlinePassed 判断逻辑一致：打卡时间未超过截止时间即为按时
    return !deadlinePassed(t,dt);
  });
}

function simulatePet(username){
  const s=getStudentPet(username);
  if(!s||!s.pet||!s.pet.petId||s.pet.healthStatus==="dead")return;
  const cfg=getPetConfig();
  const nowTs=Date.now();
  if(s.pet.lastUpdate===0){s.pet.lastUpdate=nowTs;saveData();return}
  if(nowTs<s.pet.lastUpdate){toast("检测到系统时间异常，本次不更新宠物状态","warning");return}
  let totalDeltaMin=(nowTs-s.pet.lastUpdate)/60000;
  totalDeltaMin=Math.min(totalDeltaMin,cfg.deltaMaxMin);
  if(totalDeltaMin<=0){s.pet.lastUpdate=nowTs;saveData();return}

  autoConsumeFoodCount=0;
  autoConsumeCleanerCount=0;
  const pet=s.pet;
  let remainMin=totalDeltaMin;
  let diedThisRun=false;

  while(remainMin>0){
    const stepMin=Math.min(remainMin,cfg.timeSliceMin);
    pet.full-=stepMin*cfg.decayFull;
    pet.clean-=stepMin*cfg.decayClean;

    if(pet.healthStatus==="healthy")pet.intimacy+=stepMin*cfg.intimacyAddHealthy;
    else if(pet.healthStatus==="sick")pet.intimacy-=stepMin*cfg.intimacySubSick;

    pet.full=Math.max(0,Math.min(100,pet.full));
    pet.clean=Math.max(0,Math.min(100,pet.clean));
    pet.intimacy=Math.max(0,Math.min(100,pet.intimacy));

    if(pet.healthStatus==="healthy"&&cfg.autoCareEnable){
      const foodItem=s.backpack.find(x=>x.itemId==="food");
      const cleanerItem=s.backpack.find(x=>x.itemId==="cleaner");
      if(pet.full<cfg.autoCareFullMin&&foodItem&&foodItem.count>0){
        foodItem.count-=1;
        pet.full=Math.min(100,pet.full+cfg.itemFoodAdd);
        autoConsumeFoodCount++;
        addItemLog(username,"food","宠物粮",-1,"自动喂食");
      }
      if(pet.clean<cfg.autoCareCleanMin&&cleanerItem&&cleanerItem.count>0){
        cleanerItem.count-=1;
        pet.clean=Math.min(100,pet.clean+cfg.itemCleanerAdd);
        autoConsumeCleanerCount++;
        addItemLog(username,"cleaner","清洁剂",-1,"自动清洁");
      }
    }

    if(pet.full<=cfg.sickThreshold&&pet.clean<=cfg.sickThreshold){
      if(pet.healthStatus==="healthy"){
        pet.healthStatus="sick";
        toast("宠物已经生病了，请使用药剂治疗！","warning");
      }
    }

    if(pet.healthStatus==="sick"&&pet.intimacy<=0){
      if(pet.intimacyZeroTs===0)pet.intimacyZeroTs=nowTs-(remainMin-stepMin)*60*1000;
    }else{
      pet.intimacyZeroTs=0;
    }

    if(pet.healthStatus==="sick"&&pet.intimacy<=0&&pet.intimacyZeroTs>0){
      const passedHours=(nowTs-pet.intimacyZeroTs)/(1000*60*60);
      if(passedHours>=cfg.sickToDeathHours){
        pet.healthStatus="dead";
        if(!s.deadPetIds.includes(pet.petId))s.deadPetIds.push(pet.petId);
        toast("💔很遗憾，你的宠物已经离世，可以消耗10成就点重新领养该生肖。","warning");
        diedThisRun=true;
        break;
      }
    }
    remainMin-=stepMin;
  }

  if(!diedThisRun&&(pet.full<=cfg.warnThreshold||pet.clean<=cfg.warnThreshold)&&pet.healthStatus!=="sick"){
    toast("⚠️宠物状态变差，请留意，再不照顾很快会生病！","warning");
  }

  pet.lastUpdate=nowTs;
  saveData();
}

function adoptPet(zodiacId){
  const u=state.session.username;
  const s=getStudentPet(u);
  if(!s)return;
  const isFirst=s.adoptedPetIds.length===0;
  const wasDead=s.deadPetIds.includes(zodiacId);
  const alreadyAlive=s.adoptedPetIds.includes(zodiacId)&&s.pet.healthStatus!=="dead"&&s.pet.petId===zodiacId;

  if(alreadyAlive){toast("该生肖已经是你的当前宠物","info");return}

  const isAdoptedAlive=s.adoptedPetIds.includes(zodiacId)&&s.pet.petId===zodiacId&&s.pet.healthStatus!=="dead";
  if(isAdoptedAlive){
    s.pet.petId=zodiacId;
    s.pet.petName=petName(zodiacId);
    saveData();toast("已切换为"+petName(zodiacId),"success");render();return;
  }

  if(!isFirst){
    if(s.achievementPoint<10){toast("成就点不足，需要累计全勤打卡获取成就点","error");return}
    s.achievementPoint-=10;
  }

  const nowTs=Date.now();
  s.pet={petId:zodiacId,petName:petName(zodiacId),birthTimestamp:nowTs,lastUpdate:nowTs,
    healthStatus:"healthy",full:80,clean:80,intimacy:30,intimacyZeroTs:0};
  if(!s.adoptedPetIds.includes(zodiacId))s.adoptedPetIds.push(zodiacId);
  saveData();
  petDialogCache=getPetRandomDialog(s.pet);
  toast(isFirst?"领养成功！":"领养成功！消耗10成就点","success");
  playDing();
  render();
}

function syncAchievements(filter={}){
  let changed=false;
  const today=dateKey();
  const filterDate=filter.date||"";
  const filterStudent=filter.student||"";
  for(const account of Object.values(state.data.accounts)){
    if(account.role!=="student")continue;
    if(filterStudent && account.username!==filterStudent)continue;
    const username=account.username;
    if(!Array.isArray(state.data.achievements[username]))
      state.data.achievements[username]=[];

    const unlocked=state.data.achievements[username];
    const existingDates=new Set(unlocked.map(x=>x.sourceDate));
    const dates=Object.keys(state.data.dailyTasks).sort();
    for(const d of dates){
      if(d>today)continue;
      if(filterDate && d!==filterDate)continue;
      if(existingDates.has(d))continue;
      const tasks=state.data.dailyTasks[d]||[];
      if(!tasks.length)continue;
      if(unlocked.length>=ACHIEVEMENTS.length){
        existingDates.add(d);
        continue;
      }
      const ach=ACHIEVEMENTS[unlocked.length];
      unlocked.push({
        achievementId:ach.id,
        name:ach.name,
        sourceDate:d,
        unlockDate:d,
        unlockedAt:new Date(d+"T12:00:00").toISOString()
      });
      existingDates.add(d);
      changed=true;
      if(allTasksCompleted(username,d)){
        account.achievementPoint=(account.achievementPoint||0)+1;
      }
    }
  }
  if(changed)saveData();
  return changed;
}
function getAchievementMap(username){

  const map={};
  list.forEach(x=>map[x.achievementId]=x);

function validateBackupData(obj){
  if(!obj || typeof obj!=="object")return "根数据必须是对象";
  if(Number(obj.version)!==APP_VERSION)return "备份版本不兼容";
  if(!obj.accounts || typeof obj.accounts!=="object")return "缺少账号数据";
  if(!Array.isArray(obj.taskTemplates))return "任务模板数据格式错误";
  if(!obj.dailyTasks || typeof obj.dailyTasks!=="object")return "每日任务数据格式错误";
  if(!obj.attendance || typeof obj.attendance!=="object")return "打卡数据格式错误";
  if(!obj.achievements || typeof obj.achievements!=="object")return "成就数据格式错误";
  const users=Object.values(obj.accounts);
  if(!users.some(u=>u.role==="admin"))return "备份中不存在管理员账号";
  for(const u of users){
    if(!u.username || !["admin","student"].includes(u.role) || typeof u.password!=="string")
      return "账号数据格式错误";
    if(u.role==="student"){
      if(typeof u.achievementPoint!=="number"||typeof u.totalCheckinComplete!=="number")return "宠物货币数据格式错误";
      if(!Array.isArray(u.adoptedPetIds)||!Array.isArray(u.deadPetIds))return "宠物领养数据格式错误";
      if(!Array.isArray(u.pointLogs))return "达成记录数据格式错误";
      if(!Array.isArray(u.itemLogs))return "物品记录数据格式错误";
      if(!Array.isArray(u.backpack))return "背包数据格式错误";
      if(!u.pet||typeof u.pet!=="object")return "宠物数据格式错误";
    }
  }
  return "";
}

function importBackup(){
  showModal("导入恢复",
    `<div class="warning-box">请打开本地备份 JSON 文件，全选复制全部文本，再粘贴到下面的输入框。解析失败不会修改当前数据。</div>
     <textarea id="restoreText" placeholder="请粘贴完整 JSON 备份内容"></textarea>
     <div id="restoreError" class="form-error"></div>`,
    `<button class="secondary" onclick="closeModal()">取消</button><button class="primary" id="restoreBtn">解析并恢复</button>`);
  setTimeout(()=>{
    document.getElementById("restoreBtn").onclick=()=>{
      const ta=document.getElementById("restoreText");
      const err=document.getElementById("restoreError");
      const text=ta.value.trim();
      if(!text){err.textContent="请先粘贴备份内容";return}
      let obj;
      try{obj=JSON.parse(text)}catch(e){err.textContent="备份文件解析失败，文件内容不合法";return}
      if(obj?.backupType!=="tablet-checkin-full-backup" || !obj.data){
        err.textContent="备份文件格式不正确";return;
      }
      const msg=validateBackupData(obj.data);
      if(msg){err.textContent="备份文件校验失败："+msg;return}
      const newData=normalizeData(obj.data);
      closeModal();
      confirmModal("确认恢复","导入将覆盖当前所有本地数据，确定继续？",()=>{
        state.data=newData;
        saveData();
        clearSession();
        toast("数据恢复成功，正在刷新页面","success");
        setTimeout(()=>location.reload(),700);
      });
    };
  },0);
}
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";
    document.body.appendChild(ta);ta.focus();ta.select();
    const ok=document.execCommand("copy");ta.remove();return ok;
  }catch(e){return false}
}

function renderStudentTaskCard(t,username){
  const done=isTaskCompleted(username,dateKey(),t.instanceId);
  const a=getAttendance(username,dateKey())[t.instanceId];
  const status=taskCanCheckin(t);
  let button="";
  if(done)button=`<button class="checkin-btn done" disabled>✓ 已完成</button>`;
  else if(status.reason==="not-open")button=`<button class="checkin-btn locked" disabled>05:00后开放</button>`;
  else if(status.reason==="expired")button=`<button class="checkin-btn locked" disabled>已过截止时间</button>`;
  else button=`<button class="checkin-btn primary" onclick="checkin('${t.instanceId}')">立即打卡</button>`;
  return `<div class="task-card">
    <div class="task-head"><div><div class="task-name">${escapeHtml(t.name)}</div><div class="task-desc">${escapeHtml(t.description||"")}</div></div>
    <span class="badge ${deadlinePassed(t)?"badge-danger":"badge-warning"}">截止 ${escapeHtml(t.deadline)}</span></div>
    <div class="task-foot"><div class="small muted">${done?"打卡时间："+formatDateTime(a.checkinTime):"请在截止时间前完成打卡"}</div>${button}</div>
  </div>`;
}
function checkin(instanceId){
  if(!requireStudent())return;
  ensureDailyTaskData();
  const tasks=getTodayTasks(),task=tasks.find(t=>t.instanceId===instanceId);
  if(!task){toast("任务不存在","error");return}
  if(isTaskCompleted(state.session.username,dateKey(),instanceId)){toast("请勿重复打卡","warning");return}
  const c=taskCanCheckin(task);
  if(!c.ok){
    toast(c.reason==="expired"?"已过打卡截止时间，无法打卡":"今日打卡任务尚未开放，05:00后更新","warning");
    render();return;
  }
  const now=new Date();
  setAttendance(state.session.username,dateKey(),instanceId,{completed:true,checkinTime:now.toISOString()});
  const acc=state.data.accounts[state.session.username];
  if(acc&&acc.role==="student"){
    acc.totalCheckinComplete=(acc.totalCheckinComplete||0)+1;
    addPointLog("checkin", 1, "完成打卡任务");
  }
  saveData();
  playDing();
  toast("打卡成功","success");
  render();
}

  showModal(id?"编辑任务":"新增任务",

     <div class="form-group"><label>任务描述</label><textarea id="taskDesc" style="min-height:110px" maxlength="300" placeholder="请输入任务描述">${escapeHtml(t?.description||"")}</textarea></div>

     <div class="checkbox-row"><input id="taskEnabled" type="checkbox" ${t?.enabled!==false?"checked":""}><label for="taskEnabled">启用任务</label></div>
     <div id="taskFormError" class="form-error"></div>`,

function saveTask(id){
  const name=document.getElementById("taskName").value.trim();
  const desc=document.getElementById("taskDesc").value.trim();
  const deadline=document.getElementById("taskDeadline").value;
  const enabled=document.getElementById("taskEnabled").checked;
  const err=document.getElementById("taskFormError");
  if(!name){err.textContent="任务名称不能为空";return}
  if(timeToMinutes(deadline)<0){err.textContent="请输入有效截止时间";return}
  const duplicate=state.data.taskTemplates.some(x=>x.id!==id && x.name===name);
  if(duplicate){err.textContent="任务名称已存在";return}
  if(id){
    const t=state.data.taskTemplates.find(x=>x.id===id);
    Object.assign(t,{name,description:desc,deadline,enabled});
    const today=dateKey();
    if(state.data.dailyTasks[today]){
      const daily=state.data.dailyTasks[today].find(x=>x.templateId===id);
      if(daily){
        daily.name=name;
        daily.description=desc;
        daily.deadline=deadline;
      }
    }
  }else{
    state.data.taskTemplates.push({id:uid("task"),name,description:desc,deadline,enabled,createdAt:new Date().toISOString()});
  }
  saveData();closeModal();toast(id?"任务修改成功":"任务新增成功","success");render();
}
function deleteTask(id){
  const t=state.data.taskTemplates.find(x=>x.id===id);
  if(!t)return;
  confirmModal("删除任务",`确定删除“${t.name}”任务模板吗？历史打卡记录会永久保留，次日不再生成该任务。`,()=>{
    state.data.taskTemplates=state.data.taskTemplates.filter(x=>x.id!==id);
    saveData();toast("任务模板已删除","success");render();
  });
}

  addItemLog(username,itemId,itemName,amount,amount>0?"管理员手动增加":"管理员手动扣除");

      <select id="recordStudent" onchange="setRecordFilter('student',this.value)"><option value="">全部学生</option>${students.map(s=>`<option value="${escapeHtml(s.username)}" ${s.username===state.recordFilters.student?"selected":""}>${escapeHtml(s.name)}（${escapeHtml(s.username)}）</option>`).join("")}</select>
      <select id="recordStatus" onchange="setRecordFilter('status',this.value)"><option value="">全部状态</option><option value="completed" ${state.recordFilters.status==="completed"?"selected":""}>已完成</option><option value="pending" ${state.recordFilters.status==="pending"?"selected":""}>未完成</option></select>
      <button class="secondary" onclick="clearRecordFilters()">清除筛选</button>
    </div>
    ${renderAllRecordTable(students)}`;
}
function setRecordFilter(key,value){
  state.recordFilters[key]=value;
  render();
}
function getFilter(id){return state.recordFilters[id.replace(/^record/,"").toLowerCase()]||""}
function renderAllRecordTable(students){
  const dateFilter=getFilter("recordDate"),studentFilter=getFilter("recordStudent"),statusFilter=getFilter("recordStatus");
  const rows=[];
  const dates=Object.keys(state.data.dailyTasks).sort().reverse();
  for(const d of dates){
    if(dateFilter&&d!==dateFilter)continue;
    for(const s of students){
      if(studentFilter&&s.username!==studentFilter)continue;
      const tasks=state.data.dailyTasks[d]||[];
      if(!tasks.length){
        if(!statusFilter)rows.push({d,s,t:null,a:null});
        continue;
      }
      for(const t of tasks){
        const a=getAttendance(s.username,d)[t.instanceId];
        const done=!!a?.completed;
        if(statusFilter==="completed"&&!done)continue;
        if(statusFilter==="pending"&&done)continue;
        rows.push({d,s,t,a});
      }
    }
  }
  return `<div class="table-wrap"><table><thead><tr><th>日期</th><th>学生</th><th>任务</th><th>截止时间</th><th>状态</th><th>打卡时间</th></tr></thead><tbody>
    ${rows.length?rows.map(r=>r.t?`<tr><td>${r.d}</td><td>${escapeHtml(r.s.name)}<br><span class="small muted">${escapeHtml(r.s.username)}</span></td><td>${escapeHtml(r.t.name)}</td><td>${escapeHtml(r.t.deadline)}</td>
      <td>${r.a?.completed?'<span class="badge badge-success">已完成</span>':'<span class="badge badge-danger">未完成</span>'}</td><td>${r.a?.checkinTime?formatDateTime(r.a.checkinTime):"-"}</td></tr>`
      :`<tr><td>${r.d}</td><td>${escapeHtml(r.s.name)}</td><td colspan="4">当天暂无任务</td></tr>`).join("")
    :`<tr><td colspan="6"><div class="empty">没有符合筛选条件的记录</div></td></tr>`}
  </tbody></table></div>`;
}
function clearRecordFilters(){
  state.recordFilters={date:"",student:"",status:""};
  state.page="records";render();
}

function renderStudentRecords(){
  const username=state.session.username;
  const dates=Object.keys(state.data.dailyTasks).sort().reverse();
  return `<div class="toolbar"><div><h2>我的打卡记录</h2><div class="muted">仅查看个人历史打卡记录。</div></div><button class="secondary" onclick="go('achievements')">查看成就墙</button></div>
    <div class="grid">${dates.length?dates.map(d=>renderStudentRecordDate(username,d)).join(""):`<div class="card empty">暂无历史打卡记录</div>`}</div>`;
}
function renderStudentRecordDate(username,d){
  const tasks=state.data.dailyTasks[d]||[];
  if(!tasks.length)return "";
  const done=tasks.filter(t=>isTaskCompleted(username,d,t.instanceId)).length;
  return `<div class="card"><div class="toolbar" style="margin-bottom:10px"><div><h3>${d}</h3><div class="small muted">${done}/${tasks.length} 已完成</div></div>
    ${allTasksCompleted(username,d)?'<span class="badge badge-success">全勤成就日</span>':''}</div>
    <div>${tasks.map(t=>{const a=getAttendance(username,d)[t.instanceId];return `<div style="padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div><b>${escapeHtml(t.name)}</b><div class="small muted">截止 ${escapeHtml(t.deadline)}</div></div>
      <div>${a?.completed?`<span class="badge badge-success">✓ 已完成 ${formatDateTime(a.checkinTime)}</span>`:'<span class="badge badge-danger">未完成</span>'}</div>
    </div>`}).join("")}</div>
  </div>`;
}

function renderAchievements(){
  const username=state.session.username;
  const unlocked=state.data.achievements[username]||[];
  const map=getAchievementMap(username);
  const pageCount=Math.ceil(ACHIEVEMENTS.length/6);
  const p=Math.min(state.achievementPage,pageCount-1);
  const items=ACHIEVEMENTS.slice(p*6,p*6+6);
  return `<div class="toolbar"><div><h2>成就墙</h2><div class="muted">已解锁 ${unlocked.length}/${ACHIEVEMENTS.length} 张成就</div></div>
    <div class="toolbar-right"><button class="secondary" onclick="go('home')">返回今日打卡</button></div></div>
    <div class="achievement-grid">${items.map(a=>{
      const u=map[a.id];
      return `<div class="achievement-card ${u?"unlocked":""}">
        <div class="achievement-img-wrap"><img class="achievement-img" src="${escapeHtml(a.image)}" alt="${escapeHtml(a.name)}" onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svgPlaceholder())}'"></div>
        <div class="achievement-date">${u?"解锁日期："+escapeHtml(u.unlockDate):"尚未解锁"}</div>
      </div>`;
    }).join("")}</div>
    <div class="pager"><button class="secondary" ${p<=0?"disabled":""} onclick="changeAchievementPage(-1)">上一页</button>
      <span class="muted">第 ${p+1} / ${pageCount} 页</span>
      <button class="secondary" ${p>=pageCount-1?"disabled":""} onclick="changeAchievementPage(1)">下一页</button></div>`;
}
function changeAchievementPage(delta){
  const count=Math.ceil(ACHIEVEMENTS.length/6);
  state.achievementPage=Math.max(0,Math.min(count-1,state.achievementPage+delta));
  render();
}
function svgPlaceholder(){
  return `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><rect width="128" height="128" rx="18" fill="#e9edf3"/><text x="64" y="72" text-anchor="middle" font-size="24" fill="#667085">待更新</text></svg>`;
}

function openBackupMenu(){
  showModal("数据备份恢复",
    `<div class="grid">
      <div class="card" style="box-shadow:none;border:1px solid var(--border)"><h3>成就达成 / 全量备份</h3><p class="muted">同步最新成就状态，并将全部系统数据生成JSON复制到剪贴板。</p><button class="primary" style="width:100%" onclick="closeModal();setTimeout(exportBackup,0)">执行全量备份</button></div>
      <div class="card" style="box-shadow:none;border:1px solid var(--border)"><h3>导入恢复</h3><p class="muted">将本地JSON备份内容粘贴到文本框，校验后覆盖当前LocalStorage数据。</p><button class="secondary" style="width:100%" onclick="closeModal();setTimeout(importBackup,0)">导入恢复</button></div>
    </div>
    <div class="warning-box" style="margin-top:16px">恢复操作会覆盖当前所有本地数据，执行前请确认已有最新备份。</div>`,
    `<button class="secondary" onclick="closeModal()">关闭</button>`);
}

function openChangePassword(force){
  const u=getCurrentUser();
  showModal(force?"首次登录请修改密码":"修改密码",
    `${force?'<div class="warning-box">管理员已要求你首次登录修改密码，修改成功后才能继续正常使用。</div>':""}
     <div class="form-group"><label>旧密码</label><input id="oldPassword" type="password"></div>
     <div class="form-group"><label>新密码</label><input id="newPassword" type="password" placeholder="6-64位"></div>
     <div class="form-group"><label>确认新密码</label><input id="confirmPassword" type="password"></div>
     <div id="passwordError" class="form-error"></div>`,
    force?`<button class="primary" onclick="changePassword(true)">确认修改</button>`:
    `<button class="secondary" onclick="closeModal()">取消</button><button class="primary" onclick="changePassword(false)">保存</button>`);
}
function changePassword(force){
  const u=getCurrentUser();
  const oldP=document.getElementById("oldPassword").value;
  const newP=document.getElementById("newPassword").value;
  const con=document.getElementById("confirmPassword").value;
  const err=document.getElementById("passwordError");
  if(oldP!==u.password){err.textContent="旧密码错误";return}
  if(!validatePassword(newP)){err.textContent="新密码长度必须为6-64位";return}
  if(newP!==con){err.textContent="两次输入的新密码不一致";return}
  if(newP===oldP){err.textContent="新密码不能与旧密码相同";return}
  u.password=newP;u.mustChangePassword=false;saveData();closeModal();toast("密码修改成功","success");render();
}

function renderModal(){
  const root=document.createElement("div");
  root.className="modal-mask";
  root.innerHTML=`<div class="modal">
    <div class="modal-head"><h3>${escapeHtml(state.modal.title)}</h3><button class="icon-btn" onclick="closeModal()">×</button></div>
    <div class="modal-body">${state.modal.body}</div>
    <div class="modal-foot">${state.modal.footer}</div>
  </div>`;
  document.body.appendChild(root);
}

function tick(){
  if(!authGuard())return;
  if(state.modal)return;
  const d=dateKey();
  if(d!==state.lastDate){
    state.lastDate=d;
    ensureDailyTaskData();
    render();
    return;
  }
  ensureDailyTaskData();
  const active=document.querySelector(".app");
  if(active && state.page==="home" && isStudent()){
    const time=document.querySelector(".header-title");
    // 页面状态按秒刷新，保证截止时间UI及时锁定。
    render();
  }
}

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    ensureDailyTaskData();
    if(isStudent()&&(state.page==="pet"||state.page==="petadopt")){
      petDialogCache="";
      autoConsumeFoodCount=0;
      autoConsumeCleanerCount=0;
    }
    if(!state.modal)render();
  }
});
window.addEventListener("pageshow",()=>{
  ensureDailyTaskData();
  if(isStudent()&&(state.page==="pet"||state.page==="petadopt")){
    petDialogCache="";
    autoConsumeFoodCount=0;
    autoConsumeCleanerCount=0;
  }
  if(!state.modal)render();
});

state.data=loadData();
state.lastDate=dateKey();
loadSession();
ensureDailyTaskData();
render();
setInterval(tick,1000);
</script>
</body>
</html>
